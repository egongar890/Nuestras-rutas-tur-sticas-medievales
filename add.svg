</ul></nav><main id="20260514190026RFDGWR" class="page"> <header id="header-20260514190026RFDGWR" class="page-header"> <h1 class="package-title">Nuestras rutas turísticas por la Edad Media</h1>
<h2 class="page-title">Logística para un largo viaje por el medievo</h2></header><div id="page-content-20260514190026RFDGWR" class="page-content"> <article id="20260514190026VUBBQD" class="box"> <header class="box-head no-icon"> <h1 class="box-title">Herramientas de viaje: ¿Cómo organizar nuestro viaje?</h1>
<button class="box-toggle box-toggle-on" title="Ocultar/Mostrar contenido"> <span>Ocultar/Mostrar contenido</span></button></header><div class="box-content"> <div id="20260514163609CBJBRE" class="idevice_node text" data-idevice-path="../idevices/text/" data-idevice-type="text" data-idevice-component-type="json"><div class="exe-text-template"><div class="textIdeviceContent">
            <div class="exe-text-activity">
                <div><p dir="ltr" id="yui_3_18_1_1_1778778027329_191" style="text-align: justify;">En esta unidad deberéis crear “Rutas turísticas por la Edad Media”. De esta manera, podréis aprender los conocimientos básicos de Geografía Mundial y, así, poder incorporar conocimientos históricos básicos de las distintas civilizaciones y poblaciones medievales.</p>
<p dir="ltr" style="text-align: justify;">¿Cuáles serán las herramientas digitales necesarias para elaborar vuestro producto final? Pues principalmente vamos a emplear las siguientes, aunque pueden ser muchas más:</p>
<p dir="ltr" id="yui_3_18_1_1_1778778027329_190" style="text-align: justify;"><strong id="link_6"><img src="../content/resources/20260514163609CBJBRE/Canva_logo.svg.png" title="Canva" width="69" height="26" alt="Canva"><a href="https://www.canva.com" title="Canva" target="_blank" rel="noopener">Canva</a></strong>, para crear vuestras presentaciones online. Aquí se expondrá el vocabulario que deberéis utilizar en el producto final. Además, debéis crear una presentación con las distintas ciudades y civilizaciones que van apareciendo en vuestro viaje, así como indicar características políticas, sociales, culturales, religiosas, económicas, artísticas, etc., cuestión que presentaréis al resto del grupo-clase.</p>
<p dir="ltr" id="yui_3_18_1_1_1778778027329_192" style="text-align: justify;"><strong id="link_7"><img src="../content/resources/20260514163609CBJBRE/maps_96in128dp.png" title="Google My Maps" width="37" height="37" alt="Google My Maps"><a href="https://www.google.com/maps/" title="Google My Maps" target="_blank" rel="noopener">Google My Maps</a>,</strong><span> con </span>esta extensión de <em>Google Maps </em>podréis crear vuestras propias rutas turísticas medievales. Así, durante la creación de vuestro producto final podréis indicar aquellas ciudades que vais visitando, mostrar las rutas de viaje, seleccionar los lugares de origen y destino.&nbsp;</p>
<p dir="ltr" style="text-align: justify;">Finalmente, ambas herramientas digitales os permitirán crear vuestro producto final: <strong id="link_9" title="Bizancio">"Nuestra rutas turísticas medievales"</strong>. Gracias al uso de ambas herramientas digitales, crearéis una ruta de viajes (con la herramienta de Google My Maps donde aparezcan las ciudades visitadas). Y, por otro lado, crearéis una serie de presentaciones digitales (Canva) donde aparecerá una descripción exhaustiva de estas ciudades sus respectivas civilizaciones (podéis emplear múltiples recursos visuales, audiovisuales, digitales, etc.). Os dejo por aquí algunos ejemplos: <strong><a href="https://es.wikipedia.org/wiki/Bagdad#/media/Archivo:Baghdad_150_to_300_AH.png" title="Bagdad" target="_blank" rel="noopener">Bagdad</a> </strong>durante el Califato abasí, <strong><a href="https://historia.nationalgeographic.com.es/a/aquisgran-nueva-capital-carlomagno_20072" title="Aquisgrán" target="_blank" rel="noopener">Aquisgrán</a>&nbsp;</strong>en el Imperio carolingio, <strong><a href="https://es.wikipedia.org/wiki/Califato_de_Córdoba" title="Córdoba" target="_blank" rel="noopener">Córdoba</a> </strong>bajo el Emirato Independiente en al-Ándalus o <a href="es.wikipedia.org/wiki/Bizancio" title="Bizancio" target="_blank" rel="noopener"><strong>Bizancio</strong></a> en el Imperio romano de Oriente.</p>
<h4 dir="ltr" style="text-align: justify;"><strong>Mapa político en el siglo IX</strong></h4>
<p dir="ltr" style="text-align: justify;"><img src="../content/resources/20260514163609CBJBRE/Abasside-empire-vers-820-es.svg" title="Mapa político en el siglo IX" width="1280" height="726" alt="Mapa político en el siglo IX"></p>
<p dir="ltr" style="text-align: justify;">Fuente: <strong><a href="https://es.wikipedia.org/wiki/Califato_abasí#/media/Archivo:Abasside-empire-vers-820-es.svg" title="Wikipedia" target="_blank" rel="noopener" id="link_8">Wikipedia</a></strong></p>
<h4 dir="ltr" style="text-align: justify;"><strong>Bagdad: la ciudad redonda (siglos VIII-X)</strong></h4>
<p dir="ltr" style="text-align: justify;"><strong><img src="../content/resources/20260514163609CBJBRE/Baghdad_150_to_300_AH.png" title="Bagdad entre los siglos VIII-X" width="1280" height="1025" alt="Bagdad"></strong></p>
<p dir="ltr" style="text-align: justify;">Fuente: <strong><a href="es.wikipedia.org/wiki/Bagdad#/media/Archivo:Baghdad_150_to_300_AH.png" title="Wikipedia" id="link_10">Wikipedia</a></strong></p>
<h4 dir="ltr" style="text-align: justify;"><strong>Aquisgrán, la capital del Imperio carolingio</strong></h4>
<p><strong><img src="../content/resources/20260514163609CBJBRE/la-capilla-palatina_1ca0ab49_1437855279_230817111052_1280x1707.jpg" title="Capilla Palatina de Aquisgrán" width="1280" height="1707" alt="Capilla Palatina de Aquisgrán"></strong></p>
<p>Fuente: <strong id="link_11"><a href="https://historia.nationalgeographic.com.es/a/aquisgran-nueva-capital-carlomagno_20072" title="Historia National Geographic" target="_blank" rel="noopener">Historia National Geographic</a></strong></p>
<h4><strong>Salón rico en Medina Azahara (Córdoba)</strong></h4>
<p><strong><img src="../content/resources/20260514163609CBJBRE/MA_Saln_de_Abd_al-Rahman_III_Saln_Rico.jpg" title="Córdoba" width="1280" height="954" alt="Córdoba"></strong></p>
<p>Fuente: <strong><a href="https://es.wikipedia.org/wiki/Califato_de_Córdoba#/media/Archivo:MA_Salón_de_Abd_al-Rahman_III_(Salón_Rico).jpg" title="Wikipedia" target="_blank" rel="noopener" id="link_12">Wikipedia</a></strong></p>
<h4><strong>Mapa de la Constantinopla bizantina (Imperio romano de&nbsp; Oriente)</strong></h4>
<p><strong><img src="../content/resources/20260514163609CBJBRE/564.png.webp" title="Bizancio" width="1000" height="903" alt="Bizancio"></strong></p>
<p>Fuente: <strong id="link_13"><a href="https://www.worldhistory.org/trans/es/1-11367/bizancio/" title="World History Encyclopedia" target="_blank" rel="noopener">World History Encyclopedia</a></strong></p><p class="clearfix"></p></div>
